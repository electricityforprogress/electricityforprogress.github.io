<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Firmware Uploader — bioQuad</title>
    <link rel="icon" href="./css/bioquad-icon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/flasher.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #0d1117;
            color: #e6edf3;
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .flasher-standalone-page {
            max-width: 820px;
            margin: 0 auto;
            padding: 20px 14px 36px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .flasher-standalone-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 14px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
        }
        .flasher-standalone-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flasher-standalone-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin: 0;
        }
        .flasher-standalone-link {
            color: #00f0ff;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            border: 1px solid rgba(0, 240, 255, 0.45);
            border-radius: 999px;
            padding: 5px 12px;
        }
        .flasher-standalone-link:hover {
            background: rgba(0, 240, 255, 0.14);
        }
        .flasher-standalone-card {
            background: #11161d;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
        }
    </style>
</head>
<body>
    <main class="flasher-standalone-page">
        <header class="flasher-standalone-header">
            <div class="flasher-standalone-brand">
                <img src="./css/bioquad-icon.svg" alt="bioQuad" width="26" height="26" style="border-radius: 6px; border: 1px solid #30363d;">
                <h1 class="flasher-standalone-title">ESP32 Firmware Uploader</h1>
            </div>
            <a class="flasher-standalone-link" href="./">← Back to bioQuad</a>
        </header>
        <section class="flasher-standalone-card">
            <div id="esp-flasher-root" data-manifest-url="./firmware/manifest.json"></div>
        </section>
    </main>
    <script src="./js/flasher.js"></script>
</body>
</html>
