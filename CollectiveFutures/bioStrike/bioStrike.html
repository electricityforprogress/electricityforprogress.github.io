<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioStrike Configuration</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020617">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        bio: { 400: '#34d399', 500: '#10b981', 600: '#059669', 900: '#064e3b' },
                        surface: { 50: '#1e293b', 100: '#0f172a', 200: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #34d399; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px rgba(52, 211, 153, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #334155; border-radius: 2px; }
        input[type=range]:focus { outline: none; }
        canvas { image-rendering: pixelated; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(51, 65, 85, 0.5); }
        
        .logo-container {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: breathe 4s infinite alternate ease-in-out;
        }
        
        .logo-container svg {
            width: 100%;
            height: 100%;
        }
        
        .shimmer-text {
            background: linear-gradient(
                to right, #60a5fa 0%, #a7f3d0 25%, #60a5fa 45%, #ffffff 50%, #a7f3d0 55%, #60a5fa 75%, #a7f3d0 100%     
            );
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: text-shimmer 12s ease-in-out infinite; 
        }
        
        @keyframes text-shimmer {
            0% { background-position: 0% center; }
            25% { background-position: 100% center; }
            100% { background-position: 100% center; } 
        }
        
        @keyframes breathe {
            0% { filter: drop-shadow(0 0 2px rgba(51, 181, 229, 0.3)) brightness(0.85); }
            100% { filter: drop-shadow(0 0 14px rgba(51, 181, 229, 1)) drop-shadow(0 0 28px rgba(51, 181, 229, 0.6)) brightness(1.3); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans overflow-x-hidden">

    <nav class="glass-panel sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row items-center justify-between shadow-lg shadow-bio-900/20">
        <div class="flex items-center gap-3 mb-4 sm:mb-0">
           <!-- SVG Logo omitted for brevity but remains unchanged -->
            <h1 class="text-2xl font-bold tracking-wider shimmer-text">BioStrike</h1>
        </div>
        
        <div class="flex flex-wrap items-center justify-center gap-4 text-xs font-mono">
            <div class="flex items-center gap-2 bg-surface-50 px-3 py-1.5 rounded-full border border-slate-700">
                <div id="status-gatt" class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
                <span id="text-gatt" class="text-slate-300">Web App Disconnected</span>
                <button onclick="connectBle()" class="ml-2 text-bio-400 hover:text-bio-300 underline underline-offset-2">Connect</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow p-4 sm:p-6 lg:p-8 flex flex-col gap-6 max-w-7xl mx-auto w-full">
        
        <div class="glass-panel p-4 rounded-xl flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <label for="global-channel" class="text-sm font-semibold text-slate-300">MIDI Out</label>
                <select id="global-channel" onchange="updateGlobalChannel(this.value)" class="bg-surface-100 border border-slate-600 text-white text-sm rounded-lg focus:ring-bio-500 focus:border-bio-500 block p-2 outline-none"></select>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-surface-100 px-3 py-1.5 rounded-lg border border-slate-700">
                    <label class="text-xs font-semibold text-slate-300">Test Vel: <span id="test-vel-label" class="text-bio-300 font-mono">100</span></label>
                    <input type="range" id="global-test-vel" min="1" max="127" value="100" oninput="document.getElementById('test-vel-label').innerText=this.value" class="w-24">
                </div>
                <button id="demo-btn" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-600 px-3 py-2 rounded transition-colors" onclick="toggleDemoMode()">
                    Start Simulation
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6" id="channels-container"></div>

        <div class="glass-panel p-4 rounded-xl flex-grow min-h-[250px] flex flex-col">
            <div class="relative flex-grow bg-black rounded border border-slate-800 overflow-hidden mt-2">
                <canvas id="piano-roll-canvas" class="absolute inset-0 w-full h-full"></canvas>
                <div class="absolute left-0 top-0 bottom-0 w-10 bg-surface-100/80 border-r border-slate-800 flex flex-col justify-between py-2 items-center text-[10px] text-slate-500 font-mono z-10 pointer-events-none">
                    <span id="axis-max">--</span>
                    <span id="axis-mid">--</span>
                    <span id="axis-min">--</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHAR_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let rxChar = null;
        let txChar = null;

        const state = {
            globalChannel: 1,
            demoMode: false,
            demoInterval: null,
            channels: [
                { id: 0, name: "CH 1", note: 36, minPwm: 120, maxPwm: 255, duration: 40, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#ef4444' }, 
                { id: 1, name: "CH 2", note: 38, minPwm: 100, maxPwm: 255, duration: 30, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#10b981' }, 
                { id: 2, name: "CH 3", note: 42, minPwm: 80, maxPwm: 200, duration: 15, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#0ea5e9' }, 
                { id: 3, name: "CH 4", note: 45, minPwm: 110, maxPwm: 255, duration: 35, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#f59e0b' },
                { id: 4, name: "CH 5", note: 47, minPwm: 120, maxPwm: 255, duration: 40, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#ec4899' }, 
                { id: 5, name: "CH 6", note: 48, minPwm: 100, maxPwm: 255, duration: 30, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#8b5cf6' }, 
                { id: 6, name: "CH 7", note: 50, minPwm: 80, maxPwm: 200, duration: 15, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#06b6d4' }, 
                { id: 7, name: "CH 8", note: 52, minPwm: 110, maxPwm: 255, duration: 35, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#eab308' }  
            ],
            pianoRoll: [] 
        };
        
        let midiAccess = null;
        
        async function initWebMIDI() {
            try {
                midiAccess = await navigator.requestMIDIAccess();
                checkMidiPorts();
                midiAccess.onstatechange = checkMidiPorts; 
            } catch (err) {
                console.warn("Web MIDI API not supported or access denied.", err);
            }
        }
        
        function checkMidiPorts() {
            if (!midiAccess) return;
            let isConnected = false;
            for (let input of midiAccess.inputs.values()) {
                if (input.name.toLowerCase().includes("biostrike")) isConnected = true;
            }
            for (let output of midiAccess.outputs.values()) {
                if (output.name.toLowerCase().includes("biostrike")) isConnected = true;
            }
        
            const bleStatus = document.getElementById("status-ble");
            if (bleStatus) {
                if (isConnected) {
                    bleStatus.classList.replace("bg-slate-500", "bg-bio-500");
                    bleStatus.classList.add("animate-pulse");
                } else {
                    bleStatus.classList.replace("bg-bio-500", "bg-slate-500");
                    bleStatus.classList.remove("animate-pulse");
                }
            }
        }

        async function connectBle() {
            try {
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "BioStrike" }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);

                rxChar = await service.getCharacteristic(UART_RX_CHAR_UUID);
                txChar = await service.getCharacteristic(UART_TX_CHAR_UUID);

                await txChar.startNotifications();
                txChar.addEventListener("characteristicvaluechanged", handleNotifications);

                const statusIndicator = document.getElementById("status-gatt");
                statusIndicator.classList.replace("bg-yellow-500", "bg-bio-500");
                statusIndicator.classList.add("animate-pulse");
                document.getElementById("text-gatt").innerText = "GATT Connected";
                
                sendCmd("?\n"); 
            } catch (err) {
                console.error("BLE Error: ", err);
            }
        }

        function sendCmd(cmdStr) {
            if (!rxChar) return;
            const encoder = new TextEncoder();
            rxChar.writeValueWithoutResponse(encoder.encode(cmdStr)).catch(err => console.error(err));
        }

        function handleNotifications(event) {
            const decoder = new TextDecoder();
            const raw = decoder.decode(event.target.value);
            const lines = raw.split("\n");

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                if (line.startsWith("S:")) {
                    const parts = line.split(":");
                    const ch = parseInt(parts[1], 10);
                    const vel = parseInt(parts[2], 10);
                    if(ch >= 0 && ch < 8) handleMidiHit(state.channels[ch].note, vel);
                }
                else if (line.startsWith("CFG:")) {
                    const parts = line.split(":");
                    state.globalChannel = parseInt(parts[1], 10);
                    document.getElementById('global-channel').value = state.globalChannel;

                    for (let i = 0; i < 8; i++) {
                        if (parts[i + 2]) { // Ensure config array isn't out of bounds
                            const chParams = parts[i + 2].split(",");
                            state.channels[i].note = parseInt(chParams[0], 10);
                            state.channels[i].minPwm = parseInt(chParams[1], 10);
                            state.channels[i].maxPwm = parseInt(chParams[2], 10);
                            state.channels[i].duration = parseInt(chParams[3], 10);
                        }
                    }
                    renderChannels(); 
                }
                else if (line.startsWith("BLE:")) {
                    const bleStatus = document.getElementById("status-ble");
                    if (bleStatus) {
                        if (line.trim() === "BLE:1") {
                            bleStatus.classList.replace("bg-slate-500", "bg-bio-500");
                            bleStatus.classList.add("animate-pulse");
                        } else {
                            bleStatus.classList.replace("bg-bio-500", "bg-slate-500");
                            bleStatus.classList.remove("animate-pulse");
                        }
                    }
                }
            }
        }

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        function getNoteString(noteNum) {
            const octave = Math.floor(noteNum / 12) - 1;
            return `${noteNames[noteNum % 12]}${octave} (${noteNum})`;
        }
        function getShortNote(noteNum) { return `${noteNames[noteNum % 12]}${Math.floor(noteNum / 12) - 1}`; }

        function mapRange(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        function setupGlobalChannelSelect() {
            const select = document.getElementById('global-channel');
            select.innerHTML = '<option value="0">Omni (All)</option>';
            for(let i=1; i<=16; i++) select.innerHTML += `<option value="${i}">Channel ${i}</option>`;
            select.value = state.globalChannel;
        }

        function updateGlobalChannel(val) {
            state.globalChannel = parseInt(val);
            sendCmd(`GCH:${state.globalChannel}\n`);
            setTimeout(() => sendCmd(`SAVE:99\n`), 50);
        }

        function renderChannels() {
            const container = document.getElementById('channels-container');
            container.innerHTML = '';
            state.channels.forEach((ch, index) => {
                container.innerHTML += `
                    <div class="glass-panel rounded-xl p-5 border-t-4 relative overflow-hidden group" style="border-top-color: ${ch.color}">
                        <div class="flex justify-between items-start mb-4">
                            <h2 class="text-lg font-bold text-white">${ch.name}</h2>
                            <button onclick="testStrike(${index})" class="bg-surface-100 hover:bg-slate-700 border border-slate-600 text-xs px-2 py-1 rounded transition-colors text-slate-300 flex items-center gap-1">
                                <div class="w-1.5 h-1.5 rounded-full bg-slate-500" id="indicator-${index}"></div>TEST
                            </button>
                        </div>
                        <div class="flex gap-4">
                            <div class="w-20 h-48 bg-black rounded border border-slate-700 relative flex justify-around p-1 pb-6 items-end">
                                <div class="flex flex-col items-center w-full h-full justify-end">
                                    <span id="num-vel-${index}" class="text-[10px] text-slate-400 font-mono mb-1">0</span>
                                    <div class="w-4 h-full relative bg-slate-900 rounded-sm overflow-hidden flex items-end">                    
                                        <div id="bar-vel-${index}" class="w-full transition-none" style="height: 0%; background-color: ${ch.color}"></div>
                                    </div>
                                    <span class="text-[9px] text-slate-500 font-mono mt-1">VEL</span>
                                </div>
                                <div class="flex flex-col items-center w-full h-full justify-end">
                                    <span id="num-pwm-${index}" class="text-[10px] text-slate-400 font-mono mb-1">0</span>
                                    <div class="w-4 h-full relative bg-slate-900 rounded-sm overflow-hidden flex items-end">
                                        <div id="bar-pwm-${index}" class="w-full transition-none" style="height: 0%; background-color: ${ch.color}"></div>
                                    </div>
                                    <span class="text-[9px] text-slate-500 font-mono mt-1">PWM</span>
                                </div>
                            </div>
                            <div class="flex-grow flex flex-col gap-3 justify-between">
                                <div><label class="text-xs text-slate-400 flex justify-between">Note <span id="label-note-${index}" class="text-bio-300">${getNoteString(ch.note)}</span></label><input type="range" min="0" max="127" value="${ch.note}" oninput="updateParam(${index}, 'note', this.value)" onchange="commitToFlash(${index})"></div>
                                <div><label class="text-xs text-slate-400 flex justify-between">Min PWM <span id="label-minPwm-${index}" class="text-bio-300">${ch.minPwm}</span></label><input type="range" min="0" max="255" value="${ch.minPwm}" oninput="updateParam(${index}, 'minPwm', this.value)" onchange="commitToFlash(${index})"></div>
                                <div><label class="text-xs text-slate-400 flex justify-between">Max PWM <span id="label-maxPwm-${index}" class="text-bio-300">${ch.maxPwm}</span></label><input type="range" min="0" max="255" value="${ch.maxPwm}" oninput="updateParam(${index}, 'maxPwm', this.value)" onchange="commitToFlash(${index})"></div>
                                <div><label class="text-xs text-slate-400 flex justify-between">Duration <span id="label-duration-${index}" class="text-bio-300">${ch.duration}ms</span></label><input type="range" min="5" max="100" value="${ch.duration}" oninput="updateParam(${index}, 'duration', this.value)" onchange="commitToFlash(${index})"></div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function updateParam(chIndex, param, value) {
            value = parseInt(value);
            state.channels[chIndex][param] = value;
            
            let paramId = 0;
            if (param === 'note') paramId = 0;
            if (param === 'minPwm') {
                paramId = 1;
                if (value > state.channels[chIndex].maxPwm) { 
                    state.channels[chIndex].maxPwm = value; 
                    document.querySelector(`input[oninput="updateParam(${chIndex}, 'maxPwm', this.value)"]`).value = value; 
                    document.getElementById(`label-maxPwm-${chIndex}`).innerText = value; 
                }
            }
            if (param === 'maxPwm') {
                paramId = 2;
                if (value < state.channels[chIndex].minPwm) { 
                    state.channels[chIndex].minPwm = value; 
                    document.querySelector(`input[oninput="updateParam(${chIndex}, 'minPwm', this.value)"]`).value = value; 
                    document.getElementById(`label-minPwm-${chIndex}`).innerText = value; 
                }
            }
            if (param === 'duration') paramId = 3;

            const label = document.getElementById(`label-${param}-${chIndex}`);
            if (param === 'note') label.innerText = getNoteString(value); 
            else if (param === 'duration') label.innerText = value + 'ms'; 
            else label.innerText = value;

            sendCmd(`L:${chIndex}:${paramId}:${value}\n`);
        }

        function commitToFlash(chIndex) {
            sendCmd(`SAVE:${chIndex}\n`);
        }

        function handleMidiHit(note, velocity) {
            const now = performance.now();
            state.pianoRoll.push({ note: note, velocity: velocity, x: 0, time: now });
            const channel = state.channels.find(c => c.note === note);
            if (channel) {
                let targetPwm = Math.round(Math.min(255, Math.max(0, mapRange(velocity, 1, 127, channel.minPwm, channel.maxPwm)))); 
                channel.meterVel = velocity;
                channel.meterPwm = targetPwm;
                channel.strikeEnd = now + channel.duration;
                
                document.getElementById(`num-vel-${channel.id}`).innerText = velocity;
                document.getElementById(`num-pwm-${channel.id}`).innerText = targetPwm;

                const indicator = document.getElementById(`indicator-${channel.id}`);
                if(indicator) {
                    indicator.style.backgroundColor = channel.color;
                    indicator.style.boxShadow = `0 0 8px ${channel.color}`;
                    setTimeout(() => { indicator.style.backgroundColor = '#64748b'; indicator.style.boxShadow = 'none'; }, channel.duration);
                }
            }
        }

        function testStrike(chIndex) { 
            const vel = parseInt(document.getElementById('global-test-vel').value);
            handleMidiHit(state.channels[chIndex].note, vel); 
            sendCmd(`TEST:${chIndex}:${vel}\n`);
        }

        const canvas = document.getElementById('piano-roll-canvas'); const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener('resize', resizeCanvas);

        function drawLoop() {
            const now = performance.now();
            state.channels.forEach(ch => {
                const velBar = document.getElementById(`bar-vel-${ch.id}`);
                const pwmBar = document.getElementById(`bar-pwm-${ch.id}`);
                if (velBar && pwmBar) {
                    velBar.style.height = `${(ch.meterVel / 127) * 100}%`;
                    ch.meterVel = Math.max(0, ch.meterVel * 0.96); 
                    pwmBar.style.height = `${(ch.meterPwm / 255) * 100}%`;
                    ch.meterPwm = Math.max(0, ch.meterPwm * 0.90);
                }
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.height; i += 20) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            const currentNotes = state.channels.map(c => c.note);
            let minNote = Math.min(...currentNotes) - 3; 
            let maxNote = Math.max(...currentNotes) + 3; 
            if (maxNote <= minNote) maxNote = minNote + 12; 
            
            document.getElementById('axis-max').innerText = getShortNote(maxNote);
            document.getElementById('axis-mid').innerText = getShortNote(Math.floor((maxNote+minNote)/2));
            document.getElementById('axis-min').innerText = getShortNote(minNote);

            const noteRange = maxNote - minNote;
            
            for (let i = state.pianoRoll.length - 1; i >= 0; i--) {
                let note = state.pianoRoll[i];
                note.x += 3; 
                
                const normalizedY = 1 - ((note.note - minNote) / noteRange);
                const y = normalizedY * canvas.height;
                
                const mappedChannel = state.channels.find(c => c.note === note.note);
                ctx.fillStyle = mappedChannel ? mappedChannel.color : `rgba(56, 189, 248, ${note.velocity/127 + 0.2})`; 
                ctx.shadowBlur = mappedChannel ? 10 : 0; ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(canvas.width - note.x, y - 2, Math.max(2, (note.velocity / 127) * 20), 5);
                ctx.shadowBlur = 0; 
                if (canvas.width - note.x < -20) state.pianoRoll.splice(i, 1);
            }
            requestAnimationFrame(drawLoop);
        }

        function toggleDemoMode() {
            const btn = document.getElementById('demo-btn');
            state.demoMode = !state.demoMode;
            if (state.demoMode) {
                btn.innerText = "Stop Simulation";
                btn.classList.replace('bg-slate-800', 'bg-blue-600');
                
                let beat = 0;
                state.demoInterval = setInterval(() => {
                    const kick = state.channels[0].note;
                    const snare = state.channels[1].note;
                    const hihat = state.channels[2].note;
                    const tom = state.channels[3].note;
                    
                    const ch5 = state.channels[4].note;
                    const ch6 = state.channels[5].note;
                    const ch7 = state.channels[6].note;
                    const ch8 = state.channels[7].note;
                    
                    const velHihat = beat % 4 === 0 ? 110 : 60;
                    handleMidiHit(hihat, velHihat);
                    handleMidiHit(ch7, velHihat); 
                    
                    if (beat % 8 === 0) { handleMidiHit(kick, 120); handleMidiHit(ch5, 120); }
                    if (beat % 8 === 4) { handleMidiHit(snare, 127); handleMidiHit(ch6, 127); }
                    if (beat % 16 === 11) { handleMidiHit(snare, 40); handleMidiHit(ch6, 40); }
                    if (beat % 32 === 30) { handleMidiHit(tom, 115); handleMidiHit(ch8, 115); }

                    beat++;
                }, 150); 
            } else {
                btn.innerText = "Start Simulation";
                btn.classList.replace('bg-blue-600', 'bg-slate-800');
                clearInterval(state.demoInterval);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupGlobalChannelSelect(); 
            renderChannels(); 
            resizeCanvas(); 
            requestAnimationFrame(drawLoop);
            setTimeout(() => handleMidiHit(60, 100), 500); 
        });
    </script>

    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered', reg))
                    .catch(err => console.error('Service Worker registration failed', err));
            });
        }
    </script>
</body>
</html>
