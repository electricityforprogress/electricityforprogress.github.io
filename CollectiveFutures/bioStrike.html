        /* Animate the wrapper DIV, not the SVG tag */
.logo-container {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: breathe 4s infinite alternate ease-in-out;
}

.logo-container svg {
    width: 100%;
    height: 100%;
}

.shimmer-text {
    /* 
       0-25%: The perfect resting Blue->Emerald gradient
       45-55%: The white light catching
       75-100%: An identical resting Blue->Emerald gradient to pause on
    */
    background: linear-gradient(
        to right,
        #60a5fa 0%,      /* Resting Blue start */
        #a7f3d0 25%,     /* Resting Emerald end */
        
        #60a5fa 45%,     /* Sweep approaching */
        #ffffff 50%,     /* The bright center flash */
        #a7f3d0 55%,     /* Sweep leaving */
        
        #60a5fa 75%,     /* Paused Blue start */
        #a7f3d0 100%     /* Paused Emerald end */
    );
    /* Make the background 4x wider than the text so the resting frames fit perfectly */
    background-size: 400% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    
    /* 12 seconds total: Happens much less frequently */
    animation: text-shimmer 12s ease-in-out infinite; 
}

@keyframes text-shimmer {
    /* Rests on the left side (0%) which looks exactly like your original gradient */
    0% { background-position: 0% center; }
    
    /* Takes 3 seconds (25% of 12s) to slide across smoothly, not instantly */
    25% { background-position: 100% center; }
    
    /* Pauses on the right side (100%) for 9 seconds. Because we built the right side to look identical to the left, there's no visual jump. */
    100% { background-position: 100% center; } 
}

/* Combines a neon glow drop-shadow with an actual brightness pulse */
@keyframes breathe {
    0% {
        filter: drop-shadow(0 0 2px rgba(51, 181, 229, 0.3)) brightness(0.85);
    }
    100% {
        filter: drop-shadow(0 0 14px rgba(51, 181, 229, 1)) 
                drop-shadow(0 0 28px rgba(51, 181, 229, 0.6)) 
                brightness(1.3);
    }
}

    <script>
        const state = {
            globalChannel: 1,
            demoMode: false,
            demoInterval: null,
            channels: [
                { id: 0, name: "CH 1", note: 36, minPwm: 120, maxPwm: 255, duration: 40, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#ef4444' }, 
                { id: 1, name: "CH 2", note: 38, minPwm: 100, maxPwm: 255, duration: 30, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#10b981' }, 
                { id: 2, name: "CH 3", note: 42, minPwm: 80, maxPwm: 200, duration: 15, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#0ea5e9' }, 
                { id: 3, name: "CH 4", note: 45, minPwm: 110, maxPwm: 255, duration: 35, meterVel: 0, meterPwm: 0, strikeEnd: 0, color: '#f59e0b' }  
            ],
            pianoRoll: [] 
        };

        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        function getNoteString(noteNum) {
            const octave = Math.floor(noteNum / 12) - 1;
            return `${noteNames[noteNum % 12]}${octave} (${noteNum})`;
        }
        function getShortNote(noteNum) { return `${noteNames[noteNum % 12]}${Math.floor(noteNum / 12) - 1}`; }

        function mapRange(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        function setupGlobalChannelSelect() {
            const select = document.getElementById('global-channel');
            select.innerHTML = '<option value="0">Omni (All)</option>';
            for(let i=1; i<=16; i++) select.innerHTML += `<option value="${i}">Channel ${i}</option>`;
            select.value = state.globalChannel;
        }

        function updateGlobalChannel(val) {
            state.globalChannel = parseInt(val);
        }

        function renderChannels() {
            const container = document.getElementById('channels-container');
            container.innerHTML = '';
            state.channels.forEach((ch, index) => {
                container.innerHTML += `
                    <div class="glass-panel rounded-xl p-5 border-t-4 relative overflow-hidden group" style="border-top-color: ${ch.color}">
                        <div class="flex justify-between items-start mb-4">
                            <h2 class="text-lg font-bold text-white">${ch.name}</h2>
                            <button onclick="testStrike(${index})" class="bg-surface-100 hover:bg-slate-700 border border-slate-600 text-xs px-2 py-1 rounded transition-colors text-slate-300 flex items-center gap-1">
                                <div class="w-1.5 h-1.5 rounded-full bg-slate-500" id="indicator-${index}"></div>TEST
                            </button>
                        </div>
                        <div class="flex gap-4">
                            <div class="w-20 h-48 bg-black rounded border border-slate-700 relative flex justify-around p-1 pb-6 items-end">
                                <div class="flex flex-col items-center w-full h-full justify-end">
                                    <span id="num-vel-${index}" class="text-[10px] text-slate-400 font-mono mb-1">0</span>
                                    <div class="w-4 h-full relative bg-slate-900 rounded-sm overflow-hidden flex items-end">
                                        <div id="bar-vel-${index}" class="w-full transition-all duration-75" style="height: 0%; background-color: ${ch.color}"></div>
                                    </div>
                                    <span class="text-[9px] text-slate-500 font-mono mt-1">VEL</span>
                                </div>
                                <div class="flex flex-col items-center w-full h-full justify-end">
                                    <span id="num-pwm-${index}" class="text-[10px] text-slate-400 font-mono mb-1">0</span>
                                    <div class="w-4 h-full relative bg-slate-900 rounded-sm overflow-hidden flex items-end">
                                        <div id="bar-pwm-${index}" class="w-full transition-none" style="height: 0%; background-color: ${ch.color}"></div>
                                    </div>
                                    <span class="text-[9px] text-slate-500 font-mono mt-1">PWM</span>
                                </div>
                            </div>
                            <div class="flex-grow flex flex-col gap-3 justify-between">
                                <div><label class="text-xs text-slate-400 flex justify-between">Note <span id="label-note-${index}" class="text-bio-300">${getNoteString(ch.note)}</span></label><input type="range" min="0" max="127" value="${ch.note}" oninput="updateParam(${index}, 'note', this.value)"></div>
                                <div><label class="text-xs text-slate-400 flex justify-between">Min PWM <span id="label-minPwm-${index}" class="text-bio-300">${ch.minPwm}</span></label><input type="range" min="0" max="255" value="${ch.minPwm}" oninput="updateParam(${index}, 'minPwm', this.value)"></div>
                                <div><label class="text-xs text-slate-400 flex justify-between">Max PWM <span id="label-maxPwm-${index}" class="text-bio-300">${ch.maxPwm}</span></label><input type="range" min="0" max="255" value="${ch.maxPwm}" oninput="updateParam(${index}, 'maxPwm', this.value)"></div>
                                <div><label class="text-xs text-slate-400 flex justify-between">Duration <span id="label-duration-${index}" class="text-bio-300">${ch.duration}ms</span></label><input type="range" min="5" max="100" value="${ch.duration}" oninput="updateParam(${index}, 'duration', this.value)"></div>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function updateParam(chIndex, param, value) {
            value = parseInt(value);
            state.channels[chIndex][param] = value;
            if (param === 'minPwm' && value > state.channels[chIndex].maxPwm) { state.channels[chIndex].maxPwm = value; document.querySelector(`input[oninput="updateParam(${chIndex}, 'maxPwm', this.value)"]`).value = value; document.getElementById(`label-maxPwm-${chIndex}`).innerText = value; }
            if (param === 'maxPwm' && value < state.channels[chIndex].minPwm) { state.channels[chIndex].minPwm = value; document.querySelector(`input[oninput="updateParam(${chIndex}, 'minPwm', this.value)"]`).value = value; document.getElementById(`label-minPwm-${chIndex}`).innerText = value; }
            const label = document.getElementById(`label-${param}-${chIndex}`);
            if (param === 'note') label.innerText = getNoteString(value); else if (param === 'duration') label.innerText = value + 'ms'; else label.innerText = value;
        }

        function handleMidiHit(note, velocity) {
            const now = performance.now();
            state.pianoRoll.push({ note: note, velocity: velocity, x: 0, time: now });
            const channel = state.channels.find(c => c.note === note);
            if (channel) {
                let targetPwm = Math.round(Math.min(255, Math.max(0, mapRange(velocity, 1, 127, channel.minPwm, channel.maxPwm)))); 
                channel.meterVel = velocity;
                channel.meterPwm = targetPwm;
                channel.strikeEnd = now + channel.duration;
                
                // Peak Hold: Update numeric text ONLY when a strike happens
                document.getElementById(`num-vel-${channel.id}`).innerText = velocity;
                document.getElementById(`num-pwm-${channel.id}`).innerText = targetPwm;

                const indicator = document.getElementById(`indicator-${channel.id}`);
                if(indicator) {
                    indicator.style.backgroundColor = channel.color;
                    indicator.style.boxShadow = `0 0 8px ${channel.color}`;
                    setTimeout(() => { indicator.style.backgroundColor = '#64748b'; indicator.style.boxShadow = 'none'; }, channel.duration);
                }
            }
        }

        function testStrike(chIndex) { handleMidiHit(state.channels[chIndex].note, parseInt(document.getElementById('global-test-vel').value)); }

        const canvas = document.getElementById('piano-roll-canvas'); const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener('resize', resizeCanvas);

        function drawLoop() {
            const now = performance.now();
            state.channels.forEach(ch => {
                const velBar = document.getElementById(`bar-vel-${ch.id}`);
                const pwmBar = document.getElementById(`bar-pwm-${ch.id}`);
                if (velBar && pwmBar) {
                    velBar.style.height = `${(ch.meterVel / 127) * 100}%`;
                    ch.meterVel = Math.max(0, ch.meterVel * 0.90); 
					// Smooth decay for PWM bar (same as velocity)
					pwmBar.style.height = `${(ch.meterPwm / 255) * 100}%`;
					ch.meterPwm = Math.max(0, ch.meterPwm * 0.90); // 10% decay per frame
                }
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1;
            for(let i = 0; i < canvas.height; i += 20) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke(); }

            // Dynamic Zoom Logic for Piano Roll
            const currentNotes = state.channels.map(c => c.note);
            let minNote = Math.min(...currentNotes) - 3; // Pad 3 notes below
            let maxNote = Math.max(...currentNotes) + 3; // Pad 3 notes above
            if (maxNote <= minNote) maxNote = minNote + 12; // Fallback if all set to same note
            
            // Update UI Axis
            document.getElementById('axis-max').innerText = getShortNote(maxNote);
            document.getElementById('axis-mid').innerText = getShortNote(Math.floor((maxNote+minNote)/2));
            document.getElementById('axis-min').innerText = getShortNote(minNote);

            const noteRange = maxNote - minNote;
            
            for (let i = state.pianoRoll.length - 1; i >= 0; i--) {
                let note = state.pianoRoll[i];
                note.x += 3; // Scrolling speed
                
                // Map the Y coordinate to our dynamic noteRange
                const normalizedY = 1 - ((note.note - minNote) / noteRange);
                const y = normalizedY * canvas.height;
                
                const mappedChannel = state.channels.find(c => c.note === note.note);
                ctx.fillStyle = mappedChannel ? mappedChannel.color : `rgba(56, 189, 248, ${note.velocity/127 + 0.2})`; 
                ctx.shadowBlur = mappedChannel ? 10 : 0; ctx.shadowColor = ctx.fillStyle;
                ctx.fillRect(canvas.width - note.x, y - 2, Math.max(2, (note.velocity / 127) * 20), 5);
                ctx.shadowBlur = 0; 
                if (canvas.width - note.x < -20) state.pianoRoll.splice(i, 1);
            }
            requestAnimationFrame(drawLoop);
        }

        function toggleDemoMode() {
            const btn = document.getElementById('demo-btn');
            state.demoMode = !state.demoMode;
            if (state.demoMode) {
                btn.innerText = "Stop Simulation";
                btn.classList.replace('bg-slate-800', 'bg-blue-600');
                
                let beat = 0;
                // Simulation Loop Logic
                state.demoInterval = setInterval(() => {
                    const kick = state.channels[0].note;
                    const snare = state.channels[1].note;
                    const hihat = state.channels[2].note;
                    const tom = state.channels[3].note;
                    
                    // Modulo math dictates when notes fire. "beat % 8 === 0" means every 8th step.
                    handleMidiHit(hihat, beat % 4 === 0 ? 110 : 60); 
                    if (beat % 8 === 0) handleMidiHit(kick, 120); 
                    if (beat % 8 === 4) handleMidiHit(snare, 127); 
                    if (beat % 16 === 11) handleMidiHit(snare, 40); 
                    if (beat % 32 === 30) handleMidiHit(tom, 115); 
                    beat++;
                }, 150); // Speed: Lower is faster. 150ms = 100 BPM 16th notes.
            } else {
                btn.innerText = "Start Simulation";
                btn.classList.replace('bg-blue-600', 'bg-slate-800');
                clearInterval(state.demoInterval);
            }
        }

        function openWifiModal() { document.getElementById('wifi-modal').classList.replace('hidden', 'flex'); setTimeout(() => { document.getElementById('wifi-modal').classList.remove('opacity-0'); document.getElementById('wifi-modal-content').classList.remove('scale-95'); }, 10); }
        function closeWifiModal() { document.getElementById('wifi-modal').classList.add('opacity-0'); document.getElementById('wifi-modal-content').classList.add('scale-95'); setTimeout(() => { document.getElementById('wifi-modal').classList.replace('flex', 'hidden'); }, 300); }
        function saveWifi() { closeWifiModal(); }

        document.addEventListener('DOMContentLoaded', () => {
            setupGlobalChannelSelect(); renderChannels(); resizeCanvas(); requestAnimationFrame(drawLoop);
            setTimeout(() => handleMidiHit(60, 100), 500); 
        });
    </script>
</body>
