<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collective Futures - Biorhythm Interface</title>
  
  <!-- CSS Variables and Layout[cite: 1] -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  
  <!-- Include uPlot CSS & JS for high-performance charting[cite: 1] -->
  <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">
  <script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>
  
  <style>
    /* Temporary inline styles for the buttons to get you testing quickly */
    .top-controls {
      padding: 10px 20px;
      background: #111;
      display: flex;
      gap: 15px;
      border-bottom: 1px solid #333;
    }
    button {
      padding: 10px 15px;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
    }
    button.active { background: #005500; border-color: #00ff00; }
    button.playing { background: #550000; border-color: #ff0000; }
  </style>
</head>
<body>

  <!-- Master Controls -->
  <header class="top-controls">
    <button id="btn-connect">Connect Hardware</button>
    <button id="btn-start">Start Sequencer</button>
  </header>

  <main class="dashboard-grid">
    <!-- Light Show & Real-Time Canvas[cite: 1] -->
    <section id="visualizer-container" class="dual-canvas">
      <canvas id="oscillator-canvas"></canvas>
      <canvas id="piano-roll-canvas"></canvas>
    </section>

    <!-- Telemetry & Data Logging[cite: 1] -->
    <section id="telemetry-panel" class="collapsible panel">
      <h2>Real-Time Bio-Data</h2>
      
      <!-- Numeric Readouts -->
      <div class="numeric-readouts" style="display: flex; gap: 20px; margin-bottom: 10px; font-family: monospace; font-size: 1.2rem;">
        <div class="readout-block">
          <span class="label" style="color: #888;">Resistance:</span>
          <span id="readout-ohms" style="color: #fff;">-- Ω</span>
        </div>
        <div class="readout-block">
          <span class="label" style="color: #888;">Conductance:</span>
          <span id="readout-siemens" style="color: #fff;">-- µS</span>
        </div>
      </div>

      <!-- uPlot Chart Containers[cite: 1] -->
      <div id="chart-micro" class="uplot-container"></div>
      <div id="chart-macro" class="uplot-container"></div>
    </section>
    <section id="channel1-panel" class="collapsible panel">
  <h2>Channel 1: Master Percussion</h2>
      <section id="channel1-panel" class="collapsible panel">
  <h2>Channel 1: Master Percussion</h2>
  
  <!-- KICK DRUM VOICE -->
  <div class="voice-module" id="voice-kick" style="border: 1px solid var(--accent-border); padding: 15px; margin-bottom: 15px; border-radius: 8px;">
    
    <div class="voice-header" style="display: flex; justify-content: space-between; margin-bottom: 15px;">
      <h3>Kick (MIDI Note 36)</h3>
      <label class="toggle-switch">
        <input type="checkbox" id="kick-strudel-enable" checked>
        <span class="slider">Enable Strudel Override</span>
      </label>
    </div>

    <!-- Generative Biorhythm Parameters -->
    <div class="biorhythm-controls" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
      
      <!-- Density Clamp (Anti-Cacophony) -->
      <div class="control-group">
        <label>Density Clamp (Max hits/measure)</label>
        <input type="range" id="kick-density" min="1" max="16" value="4">
        <span id="kick-density-val">4</span>
      </div>

      <!-- Bio-Velocity Influence -->
      <div class="control-group">
        <label>Bio-Velocity Influence (%)</label>
        <input type="range" id="kick-bio-vel" min="0" max="100" value="50">
        <span id="kick-bio-vel-val">50%</span>
      </div>

      <!-- Velocity Range (Min/Max) -->
      <div class="control-group" style="grid-column: span 2;">
        <label>Velocity Range [Min - Max]</label>
        <div style="display: flex; gap: 10px;">
          <input type="number" id="kick-vel-min" min="0" max="127" value="80" style="width: 60px;">
          <span> to </span>
          <input type="number" id="kick-vel-max" min="0" max="127" value="127" style="width: 60px;">
        </div>
      </div>
    </div>

    <!-- Strudel Sequence Override -->
    <div class="strudel-editor" style="border-top: 1px dashed var(--accent-border); padding-top: 15px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
        <label>Strudel Sequence:</label>
        <select id="kick-preset-select">
          <option value="1000">4-on-the-floor</option>
          <option value="[~ 1>B(30)] <[1?B(5,50)] [1*B(2,4)]> 1v127">Breakbeat</option>
        </select>
      </div>
      <textarea id="kick-sequence-input" rows="2" style="width: 100%; font-family: monospace; background: #111; color: #00ff00; padding: 10px; border: 1px solid var(--accent-border);">1000</textarea>
      
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button id="kick-apply-btn" style="flex: 1;">Apply Changes</button>
        <button id="kick-save-new" style="flex: 1;">Save as Custom</button>
      </div>
    </div>

  </div>
</section>
  
  <!-- Kick Drum Voice -->
  <div class="voice-module" id="voice-kick">
    <div class="voice-header" style="display: flex; justify-content: space-between; align-items: center;">
      <h3>Kick (Note 36)</h3>
      
      <!-- Bypass Toggle -->
      <label class="toggle-switch">
        <input type="checkbox" id="kick-strudel-enable" checked>
        <span class="slider">Enable Strudel</span>
      </label>
    </div>

    <!-- Preset Manager -->
    <div class="control-row">
      <select id="kick-preset-select">
        <optgroup label="Factory Presets">
          <option value="4-on-the-floor">[1000]</option>
          <option value="breakbeat">[~ 1>B(30)] <[1?B(5,50)] [1*B(2,4)v<60~120>]</option>
        </optgroup>
        <optgroup label="User Custom" id="kick-custom-presets">
          <!-- Custom saves populate here -->
        </optgroup>
      </select>
      <button id="kick-save-new">Save as New</button>
    </div>

    <!-- Strudel Editor -->
    <div class="strudel-editor" style="margin-top: 10px;">
      <textarea id="kick-sequence-input" rows="2" style="width: 100%; font-family: monospace; background: #111; color: #00ff00; border: 1px solid #333; padding: 10px;">[8A] 1000</textarea>
      <button id="kick-apply-btn" style="margin-top: 5px; width: 100%;">Apply Sequence</button>
    </div>
  </div>
</section>
  </main>

  <!-- Boot the Orchestrator[cite: 1] -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
