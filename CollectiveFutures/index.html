<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collective Futures</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css?v=11">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

<div class="toolbar">
<div class="brand-group">
        <img src="./css/bioquad-icon.svg" style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.5);" alt="e4p">
        <span class="bio-brand">bioQuad</span>
    </div>

    <div class="control-group right-controls">
        <button id="btn-ble" onclick="connectBLE()" style="width: 135px; display: flex; justify-content: space-between; align-items: center; text-align: left;">CONNECT <span id="ble-status" class="status-offline">●</span></button>

        <!-- MIDI DROPDOWN WITH RESTORED INPUT -->
        <div class="dropdown-widget">
            <button onclick="this.parentElement.classList.toggle('show'); event.stopPropagation();">MIDI</button>
            <div class="dropdown-content midi-panel" style="max-width: 90vw; box-sizing: border-box;" onclick="event.stopPropagation();">
                <label>MIDI In:</label>
                <select id="midi-in-select" style="width: 100%; box-sizing: border-box; margin-bottom: 6px;">
                    <option value="all">All Inputs</option>
                    <option value="none">None</option>
                </select>
                <label>Clock:</label>
                <select id="midi-clock-dir" style="width: 100%; box-sizing: border-box; margin-bottom: 6px;" onchange="window.midiClockMode = this.value; syncUI();">
                    <option value="out">MIDI Clock OUT (Master)</option>
                    <option value="in">MIDI Clock IN (Sync)</option>
                </select>
                <label>Master Out:</label>
                <select id="midi-out-select" style="width: 100%; box-sizing: border-box;">
                    <option value="none">No Output</option>
                </select>
                <hr>
                <div class="midi-ch-grid">
                    <span>CH 1</span><select id="ui-midi-ch-0" style="width: 100%; box-sizing: border-box;" onchange="updateMidiChannel(0, this.value)"></select>
                    <span>CH 2</span><select id="ui-midi-ch-1" style="width: 100%; box-sizing: border-box;" onchange="updateMidiChannel(1, this.value)"></select>
                    <span>CH 3</span><select id="ui-midi-ch-2" style="width: 100%; box-sizing: border-box;" onchange="updateMidiChannel(2, this.value)"></select>
                    <span>CH 4</span><select id="ui-midi-ch-3" style="width: 100%; box-sizing: border-box;" onchange="updateMidiChannel(3, this.value)"></select>
                </div>
            </div>
        </div>

        <div class="dropdown-widget">
            <button onclick="this.parentElement.classList.toggle('show'); event.stopPropagation();">PRESETS ▼</button>
            <div class="dropdown-content preset-panel" style="min-width: 240px; padding: 12px; gap: 6px; right: 0; left: auto;" onclick="event.stopPropagation();">
                <select id="preset-select" onchange="loadPreset(this.value)" style="width: 100%; margin-bottom: 4px;"><option value="">-- Select --</option></select>
                <div style="display: flex; gap: 4px;">
                    <button onclick="savePreset(false)" style="flex: 1;">SAVE</button>
                    <button onclick="savePreset(true)" style="flex: 0 0 auto; width: 55px;">NEW</button>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button onclick="exportPresets()" style="flex: 1; font-size: 11px;">↓ EXPORT</button>
                    <button onclick="document.getElementById('import-file').click()" style="flex: 1; font-size: 11px;">↑ IMPORT</button>
                    <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importPresets(event)">
                </div>
                <div style="display: flex; gap: 4px;">
                    <button class="danger" onclick="deleteCurrentPreset()" style="flex: 1;">DELETE</button>
                    <button class="danger" onclick="clearAllPresets()" style="flex: 0 0 auto; width: 55px;">ALL</button>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 10px; align-items: center; flex-wrap: nowrap; background: #0a0d12; padding: 5px 10px; border: 1px solid var(--border); border-radius: 4px;">
            <div style="display: flex; align-items: center; gap: 6px; padding-right: 10px; border-right: 1px solid var(--border);">
                <div class="led" id="top-bpm-led" style="margin:0; width:10px; height:10px; background:#222; box-shadow:none;"></div>
                <button onclick="tapTempo()" style="padding: 2px 6px; font-size: 11px;">TAP</button>
                <div id="ui-bpm-display" title="Drag Up/Down to Adjust" style="font-family: 'VT323', monospace; font-size: 24px; color: var(--red); min-width: 40px; text-align: center; letter-spacing: 2px; line-height: 1; cursor: ns-resize;">120</div>
            </div>
            
            <button id="toggle-synth-btn" onclick="toggleSynthUI()" style="cursor: pointer; font-weight: bold; opacity: 0.5;">SYNTH</button>
            
            <div class="dropdown-widget" style="display: flex; align-items: center; gap: 8px;">
                <div class="master-vu-container" style="display: flex; align-items: center; justify-content: center; padding: 4px 6px; cursor: pointer; background: var(--knob-bg); border: 1px solid var(--border); border-radius: 3px; transition: border-color 0.2s;" onclick="this.parentElement.classList.toggle('show'); event.stopPropagation();" onmouseover="this.style.borderColor='var(--cyan)'" onmouseout="this.style.borderColor='var(--border)'" title="Open Mixer">
                    <canvas id="master-vu-hz" width="80" height="16" style="background:#000; border-radius:2px; margin: 0 !important; display: block;"></canvas>
                </div>
                <button id="btn-master-mute" class="danger" onclick="toggleMasterMute(); event.stopPropagation();" style="padding: 3px 8px; font-size: 12px; border-radius:3px;">MUTE</button>
                <div class="dropdown-content mixer-dropdown" id="mixer-dropdown-content" onclick="event.stopPropagation();"></div>
            </div>
        </div>
    </div>
</div>

<div class="synth-inspector ui-hidden" id="synth-inspector">
<div class="synth-tabs">
        
        <!-- TAB 1 -->
        <div class="synth-tab active" onclick="selectTab(0)">
            <div style="display: flex; align-items: center; gap: 8px;"><div class="led" id="led-0"></div>CH 1</div>
            <div class="dropdown-widget">
                <button class="pill-select ch-preset-btn" id="ch-preset-btn-0" onclick="this.parentElement.classList.toggle('show'); event.stopPropagation();" style="width: auto; padding: 2px 10px;">INIT ▼</button>
                <div class="dropdown-content preset-panel" style="min-width: 180px; padding: 12px; gap: 6px; right: 0; left: auto; z-index: 999;" onclick="event.stopPropagation();">
                    <select id="ch-preset-select-0" class="pill-select" onchange="loadChannelPreset(0, this.value)" style="margin-bottom: 4px;"><option value="">-- Select --</option></select>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select" onclick="saveChannelPreset(0, false)" style="flex: 1;">SAVE</button>
                        <button class="pill-select" onclick="saveChannelPreset(0, true)" style="flex: 0 0 auto; width: 50px;">NEW</button>
                    </div>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select danger" onclick="deleteChannelPreset(0)" style="flex: 1;">DELETE</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2 -->
        <div class="synth-tab" onclick="selectTab(1)">
            <div style="display: flex; align-items: center; gap: 8px;"><div class="led" id="led-1"></div>CH 2</div>
            <div class="dropdown-widget">
                <button class="pill-select ch-preset-btn" id="ch-preset-btn-1" onclick="this.parentElement.classList.toggle('show'); event.stopPropagation();" style="width: auto; padding: 2px 10px;">INIT ▼</button>
                <div class="dropdown-content preset-panel" style="min-width: 180px; padding: 12px; gap: 6px; right: 0; left: auto; z-index: 999;" onclick="event.stopPropagation();">
                    <select id="ch-preset-select-1" class="pill-select" onchange="loadChannelPreset(1, this.value)" style="margin-bottom: 4px;"><option value="">-- Select --</option></select>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select" onclick="saveChannelPreset(1, false)" style="flex: 1;">SAVE</button>
                        <button class="pill-select" onclick="saveChannelPreset(1, true)" style="flex: 0 0 auto; width: 50px;">NEW</button>
                    </div>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select danger" onclick="deleteChannelPreset(1)" style="flex: 1;">DELETE</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 3 -->
        <div class="synth-tab" onclick="selectTab(2)">
            <div style="display: flex; align-items: center; gap: 8px;"><div class="led" id="led-2"></div>CH 3</div>
            <div class="dropdown-widget">
                <button class="pill-select ch-preset-btn" id="ch-preset-btn-2" onclick="this.parentElement.classList.toggle('show'); event.stopPropagation();" style="width: auto; padding: 2px 10px;">INIT ▼</button>
                <div class="dropdown-content preset-panel" style="min-width: 180px; padding: 12px; gap: 6px; right: 0; left: auto; z-index: 999;" onclick="event.stopPropagation();">
                    <select id="ch-preset-select-2" class="pill-select" onchange="loadChannelPreset(2, this.value)" style="margin-bottom: 4px;"><option value="">-- Select --</option></select>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select" onclick="saveChannelPreset(2, false)" style="flex: 1;">SAVE</button>
                        <button class="pill-select" onclick="saveChannelPreset(2, true)" style="flex: 0 0 auto; width: 50px;">NEW</button>
                    </div>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select danger" onclick="deleteChannelPreset(2)" style="flex: 1;">DELETE</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 4 -->
        <div class="synth-tab" onclick="selectTab(3)">
            <div style="display: flex; align-items: center; gap: 8px;"><div class="led" id="led-3"></div>CH 4</div>
            <div class="dropdown-widget">
                <button class="pill-select ch-preset-btn" id="ch-preset-btn-3" onclick="this.parentElement.classList.toggle('show'); event.stopPropagation();" style="width: auto; padding: 2px 10px;">INIT ▼</button>
                <div class="dropdown-content preset-panel" style="min-width: 180px; padding: 12px; gap: 6px; right: 0; left: auto; z-index: 999;" onclick="event.stopPropagation();">
                    <select id="ch-preset-select-3" class="pill-select" onchange="loadChannelPreset(3, this.value)" style="margin-bottom: 4px;"><option value="">-- Select --</option></select>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select" onclick="saveChannelPreset(3, false)" style="flex: 1;">SAVE</button>
                        <button class="pill-select" onclick="saveChannelPreset(3, true)" style="flex: 0 0 auto; width: 50px;">NEW</button>
                    </div>
                    <div style="display: flex; gap: 4px;">
                        <button class="pill-select danger" onclick="deleteChannelPreset(3)" style="flex: 1;">DELETE</button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <!-- SYNTHESIZER MODULES -->
    <div class="synth-controls">
        
        <!-- MODULE 1: SCALE & DENSITY -->
        <div class="synth-module scale-module">
            <div class="module-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div class="scale-title">SCALE</div>
                <div style="display: flex; align-items: center; gap: 8px; width: 130px;">
                    <span style="font-size: 9px; color: var(--text-muted); font-weight: bold;">TEST</span>
                    <input type="range" id="ui-test-injector" class="pro-slider" min="0" max="100" value="0" style="margin: 0; background: #333; flex-grow: 1;" oninput="updateActiveSynth('testIntensity', this.value)">                </div>
            </div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center; width: 100%;">
                <select id="ui-scaleRoot" class="pill-select" style="flex: 0 0 45px; color: var(--cyan); font-size: 10px; padding: 2px 4px;" onchange="updateActiveSynth('scaleRoot', this.value); applyScalePreset();">
                    <option value="0">C</option><option value="1">C#</option><option value="2">D</option><option value="3">D#</option><option value="4">E</option><option value="5">F</option><option value="6">F#</option><option value="7">G</option><option value="8">G#</option><option value="9">A</option><option value="10">A#</option><option value="11">B</option>
                </select>
                <select id="ui-scaleType" class="pill-select" style="flex: 0 0 95px; color: var(--cyan); font-size: 10px; padding: 2px 4px;" onchange="updateActiveSynth('scaleType', this.value); applyScalePreset();">
                    <option value="chromatic">Chromatic</option><option value="major">Major</option><option value="minor">Minor</option><option value="pentatonic_major">Major Pentatonic</option><option value="pentatonic_minor">Minor Pentatonic</option><option value="hirajoshi">Hirajoshi</option><option value="custom">Custom</option>
                </select>
                
                <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;">
                    <div style="display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); font-weight: bold; margin-bottom: 4px;">QUANTIZE</div>
                    <input type="range" class="pro-slider" id="ui-quantize" min="0" max="8" value="0" style="margin: 0; background: #333; width: 100%;">
                    <div style="display: flex; justify-content: space-between; font-size: 10px; color: #888; font-weight: bold; margin-top: 4px; padding: 0 2px;">
                        <span style="color:var(--cyan);">FR</span><span>/64</span><span>/32</span><span>/16</span><span>/8</span><span>/4</span><span>/4T</span><span>/2</span><span>1B</span>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 0 0 110px; display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); font-weight: bold; margin-bottom: 4px;">
                        <span>VELOCITY</span><span id="ui-vel-text" style="color: #ccc;">60 ↔ 110</span>
                    </div>
                    <div class="dual-slider-track">
                        <div class="dual-slider-fill" id="vel-fill"></div>
                        <input type="range" id="ui-vel-min" class="dual-slider-input" min="0" max="127" value="60">
                        <input type="range" id="ui-vel-max" class="dual-slider-input" min="0" max="127" value="110">
                    </div>
                </div>
                <div style="flex: 1; display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); font-weight: bold; margin-bottom: 4px;">
                        <span>RANGE</span><span id="note-range-text" style="color: #ccc;">C2 (36) ↔ C6 (84)</span>
                    </div>
                    <div class="dual-slider-track">
                        <div class="dual-slider-fill" id="note-fill"></div>
                        <input type="range" id="ui-note-min" class="dual-slider-input" min="0" max="127" value="36">
                        <input type="range" id="ui-note-max" class="dual-slider-input" min="0" max="127" value="84">
                    </div>
                </div>
            </div>

            <div class="control-row" style="align-items: stretch; height: 75px; gap: 8px;">
                <div class="piano-wrapper" id="piano-keys" style="width: 140px; margin: 0; flex-shrink: 0;">
                    <!-- Keys injected via JS -->
                </div>
                
                <div style="flex-grow: 1; display: flex; flex-direction: column;">
                    <div style="display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); font-weight: bold; margin-bottom: 4px;">
                        <span>DENSITY GATE</span><span id="ui-density-display" style="color: var(--cyan);">100%</span>
                    </div>
                    <div style="position: relative; flex-grow: 1; background: #111; border: 1px solid var(--border); border-radius: 4px; overflow: hidden;">
                        <canvas id="vu-density" style="position: absolute; width: 100%; height: 100%; left:0; top:0;"></canvas>
                        <input type="range" id="ui-slider-density" class="pro-slider" min="0" max="100" value="100" style="position: absolute; top: 50%; transform: translateY(-50%); width: 90%; left: 5%; z-index: 2; background: transparent;">
                    </div>
                </div>
                
                <div class="col-wrap" style="justify-content: center; padding-top: 4px;">
                    <div class="control-area"><div class="knob-track" data-param="durMult" data-min="0.1" data-max="5.0" data-val="1.0" data-log="true"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">DUR</div>
                </div>
                
                <div class="col-wrap" style="justify-content: center; padding-top: 4px;">
                    <div class="control-area"><div class="knob-track" data-param="spread" data-min="0" data-max="100" data-val="75"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">SPREAD</div>
                </div>
            </div>
        </div>

        <!-- MODULE 2: VOICE -->
        <div class="synth-module voice-module">
            <div class="module-header"><div class="voice-title">VOICE</div></div>
            <div class="control-row">
                
                <div class="col-wrap" style="width: 80px; align-items: center;">
                    <div class="control-area" style="flex-direction: column; gap: 6px; align-items: center; height: auto; width: 100%; margin-top: 8px;">
                        <select id="ui-wave" class="pill-select" style="width: 100%; padding: 2px 4px;" onchange="updateNestedSynth('sources', 'osc1.type', this.value)">
                            <option value="sawtooth">Sawtooth</option><option value="square">Square</option><option value="triangle">Tri</option><option value="sine">Sine</option><option value="noise">Noise</option><option value="drums">Drums</option>
                        </select>
                        <select id="ui-steal" class="pill-select" style="width: 100%; padding: 2px 4px;" onchange="updateActiveSynth('stealMode', this.value)">
                            <option value="oldest">Stl: Old</option><option value="lowest">Stl: Low</option><option value="highest">Stl: High</option><option value="none">Stl: Off</option>
                        </select>
                        <div class="pill-toggle" id="legato-wrapper" style="width: 65%; height: 14px; margin-top: 2px;">
                            <input type="checkbox" id="ui-legato" onchange="updateActiveSynth('legato', this.checked ? 1 : 0)">
                            <label for="ui-legato" style="line-height: 14px; font-size: 8px;">LEGATO</label>
                        </div>
                    </div>
                </div>
                
                <div class="divider"></div>

                <div class="col-wrap">
                    <div class="control-area">
                        <div class="knob-track" id="poly-knob" data-param="voices" data-val="5" data-min="1" data-max="8">
                            <div class="knob-dial"><div class="knob-indicator"></div></div>
                        </div>
                    </div>
                    <div class="control-label" style="display: flex; align-items: center; justify-content: center; gap: 3px; width: 150%; height: 10px; margin: 0; padding: 0;">
                        <span>POLY</span><span id="poly-readout" style="color: var(--cyan);">5</span>
                    </div>
                </div>

                <div class="col-wrap">
                    <div class="control-area"><div class="knob-track" data-param="glide" data-min="0" data-max="0.5" data-val="0.1"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">GLIDE</div>
                </div>

                <div class="col-wrap">
                    <div class="control-area"><div class="knob-track" data-param="sub.level" data-group="sources" data-min="0" data-max="1" data-val="0.5"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">SUB</div>
                </div>
                
            </div>
        </div>

        <!-- MODULE 3: MODULATION -->
        <div class="synth-module mod-module">
            <div class="module-header">
                <div class="mod-title">MODULATION</div>
                <div class="target-selectors">
                    <label><input type="radio" name="activeLfo" value="pitchLfo" onchange="switchModView('lfo', this.value); switchModView('env', 'pitchEnv');"><div class="mod-led led-pitch" id="ind-lfo-pitchLfo"></div><span>PITCH</span></label>
                    <label><input type="radio" name="activeLfo" value="filterLfo" onchange="switchModView('lfo', this.value); switchModView('env', 'filterEnv');"><div class="mod-led led-filter" id="ind-lfo-filterLfo"></div><span>FILTER</span></label>
                    <label><input type="radio" name="activeLfo" value="ampLfo" checked onchange="switchModView('lfo', this.value); switchModView('env', 'ampEnv');"><div class="mod-led led-amp" id="ind-lfo-ampLfo"></div><span>AMP</span></label>
                </div>
            </div>

            <div class="control-row">
                <div class="col-wrap" style="width: 55px;">
                    <div class="control-area">
                        <div class="stacked-config">
                            <select id="ui-lfo-shape" class="pill-select" onchange="updateNestedSynth('lfo', 'shape', this.value)">
                                <option value="sine">Sine</option><option value="square">Square</option><option value="triangle">Tri</option>
                                <option value="sawtooth">Up</option><option value="rampdown">Down</option><option value="random">S&H</option>
                            </select>
                            <div class="pill-toggle">
                                <input type="radio" id="rate-lo" name="lfoRateMode" value="lo" checked onchange="window.updateLfoRateMode(this.value)">
                                <label for="rate-lo">LO</label>
                                <input type="radio" id="rate-hi" name="lfoRateMode" value="hi" onchange="window.updateLfoRateMode(this.value)">
                                <label for="rate-hi">HI</label>
                            </div>
                        </div>
                    </div>
                    <div class="control-label">SHAPE</div>
                </div>

                <div class="col-wrap">
                    <div class="control-area"><div class="knob-track" data-param="rate" data-group="lfo" data-min="0.01" data-max="20" data-val="2.0" data-log="true"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">RATE</div>
                </div>

                <div class="col-wrap">
                    <div class="control-area"><div class="knob-track" data-param="depth" data-group="lfo" data-min="0" data-max="1" data-val="0"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">DPTH</div>
                </div>

                <div class="divider"></div>

                <div class="adsr-group">
                    <div class="col-wrap"><div class="control-area"><div class="v-slider-container"><input type="range" class="v-slider" id="ui-env-atk" min="0.01" max="10" step="0.01" oninput="updateNestedSynth('env', 'atk', this.value)"></div></div><div class="control-label">A</div></div>
                    <div class="col-wrap"><div class="control-area"><div class="v-slider-container"><input type="range" class="v-slider" id="ui-env-dec" min="0.01" max="10" step="0.01" oninput="updateNestedSynth('env', 'dec', this.value)"></div></div><div class="control-label">D</div></div>
                    <div class="col-wrap"><div class="control-area"><div class="v-slider-container"><input type="range" class="v-slider" id="ui-env-sus" min="0" max="1" step="0.01" oninput="updateNestedSynth('env', 'sus', this.value)"></div></div><div class="control-label">S</div></div>
                    <div class="col-wrap"><div class="control-area"><div class="v-slider-container"><input type="range" class="v-slider" id="ui-env-rel" min="0.01" max="20" step="0.01" oninput="updateNestedSynth('env', 'rel', this.value)"></div></div><div class="control-label">R</div></div>
                </div>
            </div>
        </div>

        <!-- MODULE 4: FILTER & EFFECTS -->
        <div class="synth-module fx-module">
            <div class="module-header">
                <div class="fx-title"><span style="color: var(--green);">FILTER</span></div>
                <div class="target-selectors" style="gap: 24px;">
                    <label><input type="radio" name="activeFx" value="drv" checked onchange="switchModView('fx', this.value)"><div class="mod-led led-pitch" id="ind-fx-drv"></div><span>DRV</span></label>
                    <label><input type="radio" name="activeFx" value="dly" onchange="switchModView('fx', this.value)"><div class="mod-led led-filter" id="ind-fx-dly"></div><span>DLY</span></label>
                    <label><input type="radio" name="activeFx" value="rev" onchange="switchModView('fx', this.value)"><div class="mod-led led-amp" id="ind-fx-rev"></div><span>REV</span></label>
                </div>
            </div>

            <div class="control-row">
                <div class="col-wrap fx-filter-knob">
                    <div class="control-area"><div class="knob-track" data-param="cutoff" data-group="filter" data-min="100" data-max="10000" data-val="2000" data-log="true"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label" style="color: var(--green);">CUTOFF</div>
                </div>

                <div class="col-wrap fx-filter-knob">
                    <div class="control-area"><div class="knob-track" data-param="res" data-group="filter" data-min="0" data-max="20" data-val="6"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label" style="color: var(--green);">RES</div>
                </div>

                <div class="divider"></div>

                <div class="col-wrap fx-dynamic-knob">
                    <div class="control-area"><div class="knob-track" id="fx-send-knob" data-param="drv" data-group="fx" data-min="0" data-max="1" data-val="0"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">SEND</div>
                </div>
                
                <!-- DRV Controls -->
                <div class="col-wrap fx-dynamic-knob fx-params fx-drv-params">
                    <div class="control-area"><div class="knob-track" data-param="drvGrit" data-group="fx" data-min="0" data-max="100" data-val="10"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">GRIT</div>
                </div>
                <div class="col-wrap fx-dynamic-knob fx-params fx-drv-params">
                    <div class="control-area"><div class="knob-track" data-param="drvTone" data-group="fx" data-min="100" data-max="10000" data-log="true" data-val="2000"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">TONE</div>
                </div>
                <div class="col-wrap fx-params fx-drv-params">
                    <div class="control-area"><div class="v-slider-container"><input type="range" class="v-slider" id="ui-fx-drv-lvl" min="0" max="1" step="0.01" value="1.0" oninput="updateNestedSynth('fx', 'drvLvl', this.value)"></div></div>
                    <div class="control-label">LVL</div>
                </div>

                <!-- DLY Controls -->
                <div class="col-wrap fx-dynamic-knob fx-params fx-dly-params" style="display: none;">
                    <div class="control-area"><div class="knob-track" data-param="time" data-group="globalFx.dly" data-min="0.01" data-max="10.0" data-val="0.5"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">TIME</div>
                </div>
                <div class="col-wrap fx-dynamic-knob fx-params fx-dly-params" style="display: none;">
                    <div class="control-area"><div class="knob-track" data-param="feedback" data-group="globalFx.dly" data-min="0" data-max="0.95" data-val="0.5"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">FDBK</div>
                </div>
                <div class="col-wrap fx-params fx-dly-params" style="display: none;">
                    <div class="control-area"><div class="v-slider-container"><input type="range" class="v-slider" id="ui-fx-torev" min="0" max="1" step="0.01" value="0.2" oninput="updateNestedSynth('globalFx.dly', 'toRev', this.value)"></div></div>
                    <div class="control-label">>REV</div>
                </div>
                
                <!-- REV Controls -->
                <div class="col-wrap fx-dynamic-knob fx-params fx-rev-params" style="display: none;">
                    <div class="control-area"><div class="knob-track" data-param="size" data-group="globalFx.rev" data-min="0.1" data-max="8.0" data-val="2.0"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">SIZE</div>
                </div>
                <div class="col-wrap fx-dynamic-knob fx-params fx-rev-params" style="display: none;">
                    <div class="control-area"><div class="knob-track" data-param="damp" data-group="globalFx.rev" data-min="500" data-max="15000" data-log="true" data-val="3000"><div class="knob-dial"><div class="knob-indicator"></div></div></div></div>
                    <div class="control-label">DAMP</div>
                </div>
                <div class="col-wrap fx-params fx-rev-params" style="display: none;">
                    <div class="control-area"><div class="v-slider-container"><input type="range" class="v-slider" id="ui-fx-rev-hpf" min="20" max="2000" step="1" value="100" oninput="updateNestedSynth('globalFx.rev', 'hpf', this.value)"></div></div>
                    <div class="control-label">HPF</div>
                </div>

            </div>
        </div>
        
    </div>
</div>

<div id="dashboard"></div>

<script src="js/globals.js?v=11"></script>
<script src="js/audioEngine.js?v=11"></script>
<script src="js/uiController.js?v=11"></script>
<script src="js/visualizer.js?v=11"></script>
<script src="js/bleMidi.js?v=11"></script>
<script src="js/main.js?v=11"></script>

<script>
    // Register Service Worker for Offline PWA Support
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(reg => {
                console.log('ServiceWorker registration successful');
            }).catch(err => {
                console.log('ServiceWorker registration failed: ', err);
            });
        });
    }

    // Global click listener to automatically close dropdowns
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.dropdown-widget')) {
            document.querySelectorAll('.dropdown-widget.show').forEach(w => w.classList.remove('show'));
        }
    });
</script>

</body>
</html>
