<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>High School Park AR Prototype</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #222; color: #333; }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; color: white; z-index: 9999; text-align: center; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px;}
    #container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; display: flex; flex-direction: column; justify-content: space-between; }
    .ui-interactive { pointer-events: auto; }

    #top-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0)); }
    .nav-btn { background: rgba(255, 255, 255, 0.9); border: none; padding: 6px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; color: #333; }
    .nav-btn.donate { background: #28a745; color: white; }
    .nav-btn.contribute { background: #0056b3; color: white; }

    /* Bottom Debug Telemetry Panel */
    #bottom-panel { background: rgba(0, 0, 0, 0.85); color: white; margin: 15px; padding: 12px 15px; border-radius: 8px; font-family: monospace; font-size: 12px; line-height: 1.5; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #bottom-panel div { margin-bottom: 3px; }

    #history-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 500px; background: white; padding: 20px; border-radius: 8px; z-index: 2000; pointer-events: auto; max-height: 70vh; overflow-y: auto; color: #333;}
    .close-modal { background: #dc3545; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; float: right; font-weight: bold; }
  </style>
</head>
<body>

  <div id="loading">Requesting GPS permissions...</div>
  <div id="container"></div>

  <div id="ui-layer">
    <!-- Top Navigation with Contribute, Website, Donate, History -->
    <div id="top-nav" class="ui-interactive">
      <button class="nav-btn" onclick="toggleHistory()">Park History</button>
      <a href="https://electricityforprogress.com" target="_blank" class="nav-btn">Our Website</a>
      <a href="https://electricityforprogress.com/donate" target="_blank" class="nav-btn donate">Donate</a>
      <a href="mailto:CHS_AR@hspark.org?subject=High%20School%20Park%20AR%20Contribution" class="nav-btn contribute">Contribute</a>
    </div>

    <!-- Bottom Debug Telemetry Panel -->
    <div id="bottom-panel" class="ui-interactive">
      <div><strong>Status:</strong> <span id="debug-status">Initializing GPS...</span></div>
      <div><strong>Distance:</strong> <span id="debug-dist">--</span></div>
      <div><strong>GPS Lat/Lng:</strong> <span id="debug-coords">--</span></div>
      <div><strong>GPS Accuracy:</strong> <span id="debug-acc">--</span></div>
      <div><strong>Heading:</strong> <span id="debug-heading">--</span></div>
    </div>
  </div>

  <div id="history-modal">
    <button class="close-modal" onclick="toggleHistory()">Close</button>
    <h2>History of High School Park</h2>
    <p>Insert historical text here about the demolished high school and surrounding park grounds.</p>
  </div>

<script>
    window.onerror = function(msg, url, line) {
      document.getElementById('loading').innerHTML = `JS Error: ${msg}<br>Line: ${line}`;
    };

    function toggleHistory() {
      const modal = document.getElementById('history-modal');
      modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }

  //40.067356, -75.124541
    const PARK_LAT = 40.067356; 
    const PARK_LNG = -75.124541;
    const MAX_DISTANCE_METERS = 500;
    const MODEL_URL = 'HStest.glb';

    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180;
      const dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp / 2) * Math.sin(dp / 2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    function getHeadingText(deg) {
      if (deg === null || deg === undefined || isNaN(deg)) return "Calibrating (Move phone)";
      const directions = ["North", "North-East", "East", "South-East", "South", "South-West", "West", "North-West"];
      const val = Math.floor((deg / 45) + 0.5);
      return `${directions[(val % 8)]} (${Math.round(deg)}°)`;
    }

    // Live Compass Listener
    let currentHeading = null;
    function initCompass() {
      // iOS 13+ permission request check
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            window.addEventListener('deviceorientationabsolute', handleOrientation, true) || window.addEventListener('deviceorientation', handleOrientation, true);
          }
        }).catch(console.error);
      } else {
        // Android & standard browsers
        window.addEventListener('deviceorientationabsolute', handleOrientation, true) || window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    function handleOrientation(event) {
      let compass = null;
      // iOS provides alpha or webkitCompassHeading
      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        compass = event.webkitCompassHeading;
      } 
      // Android / W3C standard absolute orientation
      else if (event.absolute && event.alpha !== null) {
        compass = 360 - event.alpha;
      } else if (event.alpha !== null) {
        compass = 360 - event.alpha;
      }

      if (compass !== null) {
        currentHeading = compass;
        document.getElementById('debug-heading').innerHTML = getHeadingText(currentHeading);
      }
    }

    function renderParkAR() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('container').innerHTML = `
        <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
          <a-camera gps-camera="gpsMinDistance: 3" far="2000"></a-camera>
          
          <a-entity gps-entity-place="latitude: ${PARK_LAT}; longitude: ${PARK_LNG};">
            <a-entity gltf-model="url(${MODEL_URL})" 
                      scale="5 5 5" 
                      rotation="0 0 0" 
                      position="0 20 0">
            </a-entity>
          </a-entity>
        </a-scene>
      `;
    }

    function renderOffsiteFallback() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('container').innerHTML = `
        <model-viewer src="${MODEL_URL}" alt="Windmill Model" camera-controls auto-rotate ar ar-modes="webxr scene-viewer quick-look" style="width: 100%; height: 100%;"></model-viewer>
      `;
    }

    const statusText = document.getElementById('loading');
    const dbgStatus = document.getElementById('debug-status');
    const dbgDist = document.getElementById('debug-dist');
    const dbgCoords = document.getElementById('debug-coords');
    const dbgAcc = document.getElementById('debug-acc');
    const dbgHeading = document.getElementById('debug-heading');

    let arStarted = false;

    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          const acc = position.coords.accuracy;
          const distance = getDistanceInMeters(lat, lng, PARK_LAT, PARK_LNG);

          dbgCoords.innerHTML = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          dbgAcc.innerHTML = `±${Math.round(acc)}m`;
          dbgDist.innerHTML = `${Math.round(distance)}m`;

          if (!arStarted) {
            if (distance <= MAX_DISTANCE_METERS) {
              arStarted = true;
              dbgStatus.innerHTML = "AR Active (Within Range)";
              initCompass(); // Fire up orientation sensors when AR kicks off
              renderParkAR();
            } else {
              dbgStatus.innerHTML = "Waiting for proximity...";
              statusText.innerHTML = `You are ${Math.round(distance)}m away.<br>Get closer to launch AR.`;
            }
          }
        },
        (error) => {
          dbgStatus.innerHTML = `GPS Error (${error.code}) - Fallback loading`;
          setTimeout(() => renderOffsiteFallback(), 3000);
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    } else {
      dbgStatus.innerHTML = "GPS Not Supported";
      setTimeout(() => renderOffsiteFallback(), 2000);
    }
  </script>
</body>
</html>
